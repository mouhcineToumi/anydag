# Postgres 17 on the one machine: it shares about 1 GB of RAM with the api and Caddy, so it says
# so itself. Small buffers, few connections, small sorts — a sync server's queries are many tiny
# indexed ones, not warehouse scans. deploy/compose.yaml loads it with
# `postgres -c config_file=/etc/postgresql/postgresql.conf`.
#
# Everything else stays Postgres' own default, and durability is not traded: synchronous_commit
# is still on, and the WAL at these sizes still survives a crash.

# This file is loaded with -c config_file, which replaces the image's own: anything the docker
# image sets there on purpose has to be set here too, or the stack loses it. The image listens on
# every interface, because its clients are containers on the compose network, not the host.
listen_addresses = '*'

# The buffers. 128 MB is Postgres' own shared_buffers of a dedicated 1 GB machine; shared with two
# other services, it is what fits when the api's caches and Caddy's are counted too.
shared_buffers = 128MB
effective_cache_size = 384MB

# Few connections: the api pools (pg's default pool), Caddy holds none, and `pg_restore` needs
# one. Thirty is generous and costs little.
max_connections = 30

# Every connection's temp memory: accounts for usage snapshots and the collector, never for a
# scan of a whole vault's log, which is indexed and paged.
work_mem = 2MB
maintenance_work_mem = 32MB

# The WAL: small machine, small writes — the sync commits are a few hundred bytes.
max_wal_size = 512MB
min_wal_size = 64MB
checkpoint_completion_target = 0.9

# Long statements are a defect, not a size: say them and the metric says so.
log_min_duration_statement = 1000
