# The AnyDag desktop shell: an AppImage on Linux (x64), a dmg and a zip per architecture on macOS
# (arm64 and x64), an NSIS installer on Windows (x64). Each is built on its own OS —
# `npm run desktop:dist` builds the one it runs on, and `.github/workflows/desktop-build.yml` builds all
# three. Signing is the workflow's: it signs when a certificate is in its secrets, and otherwise
# the macOS app is signed ad hoc (`-c.mac.identity=-`) and the Windows installer is not signed.
#
# Two facts the files list encodes: the server and the CLI bundles are the two things an
# Electron-as-Node child executes, so they (and their one native module, `@parcel/watcher`) are
# unpacked from the asar onto the real filesystem; the page and the shell stay packed — the main
# process reads its own asar, children read real files.
#
# `files` is the walk. **electron-builder packs every production dependency whatever `files` says**
# — the page and the server are bundles, so that was 238 MB of `node_modules` nothing reads — and
# `!node_modules/**/*` then the five modules by name is what keeps it to the ones a child requires.
# Invoke with the config named — electron-builder looks at the repository root by default:
#   electron-builder --config desktop/electron-builder.yml
appId: io.github.mouhcinetoumi.anydag
productName: AnyDag
icon: desktop/icon.png
directories:
  output: release
# The one native module, `@parcel/watcher`, is N-API and prebuilt per platform; there is nothing to
# rebuild for Electron, and a rebuild from its `binding.gyp` fails outright when one machine packages
# a second architecture (the macOS job builds x64 on arm64).
npmRebuild: false
files:
  - desktop/dist
  - dist
  - server/dist
  - cli/dist
  - package.json
  # The one native module the server keeps out of its bundle, its prebuilt binary — whichever
  # `@parcel/watcher-<os>-<arch>` is installed; the macOS job installs the second architecture's
  # beside the first — and, read off its runtime `require`s, exactly four dependencies that need no
  # build: picomatch (no deps in 4.x), is-glob → is-extglob, and detect-libc.
  - "!node_modules/**/*"
  - node_modules/@parcel/watcher/**/*
  - node_modules/@parcel/watcher-*/**/*
  - node_modules/picomatch/**/*
  - node_modules/is-glob/**/*
  - node_modules/is-extglob/**/*
  - node_modules/detect-libc/**/*
  - "!boards"
  - "!e2e"
  - "!src"
  - "!test"
  - "!docs"
  - "!scripts"
  - "!eval"
  - "!icons"
  - "!services"
  - "!themes"
  - "!skills"
  - "!release"
asarUnpack:
  # What Electron-as-Node children execute or require. A real-file `require` cannot see inside the
  # asar, so the watcher and everything it loads at runtime live beside it on the disk — with the
  # bundles `server/dist` and `cli/dist` that own the only requires.
  - node_modules/@parcel/watcher/**
  - node_modules/@parcel/watcher-*/**
  - node_modules/picomatch/**
  - node_modules/is-glob/**
  - node_modules/is-extglob/**
  - node_modules/detect-libc/**
  - server/dist/**
  - cli/dist/**
protocols:
  - name: AnyDag
    schemes:
      - anydag
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  # The WM_CLASS a running window carries, so the shell associates it with this .desktop entry.
  syncDesktopName: true
  # The electron binary's name inside the squashfs — the shim in `desktop/main.ts` execs it by
  # this exact name after `--appimage-mount` (or the extract fallback) finds it.
  executableName: anydag
mac:
  # One build per architecture rather than a universal one: a universal app is both Electrons in
  # one bundle, twice the download for everybody, and the updater picks the right zip by its name.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # No spaces, and the arch always said: the release's file names are the updater's URLs.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Hardened runtime with electron-builder's default entitlements (JIT, unsigned executable memory,
  # library validation off — the last is what lets the ad-hoc-signed watcher load). Notarisation
  # runs when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are in the environment.
  hardenedRuntime: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # `AnyDag Setup 0.2.0.exe` by default: GitHub turns the spaces into dots on upload and
  # `latest.yml` would then name a file the release does not have.
  artifactName: ${productName}-Setup-${version}.${ext}
# The update channel is not configured here: it is the version's pre-release word — `0.2.0` is
# `latest`, `0.2.0-beta.1` is `beta`, `0.2.0-nightly.202611070230` is `nightly` — and it names the
# files the updater reads (`latest.yml`, `beta-linux.yml`, `nightly-mac.yml`…); the app reads the same
# word back off its own version (`desktop/main.ts`). electron-builder's `detectUpdateChannel` does
# not apply to the `github` provider, so `desktop/package.mjs` passes `-c.publish.channel=<word>` for
# a pre-release and checks the files really are the channel's; `scripts/check-release-assets.mjs`
# checks that a release holds them.
publish:
  provider: github
  owner: mouhcineToumi
  repo: anydag
