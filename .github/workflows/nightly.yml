# The nightly: `develop`, built and published every night as a GitHub pre-release.
#
#   1. **prepare** — skipped when nothing is new: the newest `nightly/*` branch's commit already has
#      `develop`'s head as its parent. Otherwise it stamps a version into a commit of its own,
#      `X.Y.Z-nightly.YYYYMMDDHHmm` (`X.Y.Z` is `develop`'s `VERSION`, the next release; the stamp is
#      one number so that semver accepts it before 10:00 and the clock orders it), and pushes
#      the branch `nightly/<version>` and the tag `v<version>` at that commit. **Each nightly gets its
#      own branch, and nothing here ever deletes one.** `develop` itself is never touched.
#   2. **checks, e2e, desktop** — everything, against that tag: the fast tier and the api server's
#      suites, the full Playwright run (`e2e.yml`), and the desktop app on all three systems.
#      Beside them, **bench**: the two resource guards (`scripts/bench.mjs --guard`), which hold
#      nothing back.
#   3. **publish** — a pre-release with every installer and the nightly update files
#      (`nightly.yml`, `nightly-linux.yml`, `nightly-mac.yml`), and only if every one is there.
#
# Beside them, every night whether or not there is a build: **secrets**, gitleaks over the whole
# history of `develop` (`scripts/secrets.sh all`), and **waste**, the whole tree's duplicated blocks
# and over-complex functions (#526) with their totals and worst entries in the run summary.
#
# **Why this publishes itself.** A push made with `GITHUB_TOKEN` starts no other workflow, so the tag
# below does not start `release.yml` — which would refuse it anyway, because a nightly is not a release.
#
# **Who gets it.** The update channel is the version's own word (`nightly`): a build installed from
# one asks for `nightly*.yml` and follows nightlies, and a stable or beta build never sees a nightly,
# because a pre-release is not GitHub's "latest" and a beta only follows `beta` — unless its person
# chose *Nightly* in Settings → About (#525). `desktop/main.ts` says how.
#
# `e2e.yml` runs at this workflow's own commit, `develop`'s head — the stamped commit's parent, and the
# same code but for three version lines.
#
# Needs: Actions allowed to write to the repository, branches matching `nightly/*` and tags `v*-nightly.*`
# open to `github-actions[bot]` in any ruleset; the signing secrets are optional (`release.yml`).
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even though develop has not moved since the last nightly."
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Is there anything new?
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # The newest nightly by its stamp (`…-nightly.<YYYYMMDDHHmm>`), not by name: `0.10.0` sorts
          # before `0.9.0`.
          newest=$(git ls-remote --heads origin 'refs/heads/nightly/*' \
            | while read -r _ ref; do b=${ref#refs/heads/}; s=${b##*-nightly.}; case "$s" in ''|*[!0-9]*) continue ;; esac; echo "$s $b"; done \
            | sort -n | tail -n 1 | cut -d' ' -f2)
          if [ -z "$newest" ]; then
            echo "No nightly yet."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=2 origin "refs/heads/$newest:refs/remotes/origin/$newest"
          parent=$(git rev-parse "origin/$newest^")
          if [ "$parent" = "$head" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::develop is at $head, which $newest was already built from — nothing new."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "develop is at $head; $newest was built from $parent."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp the version, push the branch and the tag
        id: stamp
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          core=$(tr -d '[:space:]' < VERSION)
          core=${core%%-*}
          stamp=$(date -u +%Y%m%d%H%M)
          version="$core-nightly.$stamp"
          git switch -c "nightly/$version"
          node scripts/set-version.mjs "$version"
          node scripts/check-version.mjs "v$version"
          git add VERSION package.json package-lock.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(release): nightly $version"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "v$version" -m "AnyDag nightly $stamp"
          git push origin "nightly/$version"
          git push origin "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Pushed nightly/$version and v$version at $(git rev-parse HEAD)."

  # The whole history of `develop`, every night, whether or not there is a build: a pull request's
  # scan sees only its own commits, and a newer gitleaks can know a key shape an older one did not.
  # A hit here is a secret already public — revoke it first (SECURITY.md); it does not hold the
  # nightly back, because holding a build back would not unpublish it.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks
      - run: bash scripts/secrets.sh selftest
      - run: bash scripts/secrets.sh all

  # The two wastes of agent-written code, over the whole tree (#526): duplicated blocks (jscpd) and
  # functions over the cognitive-complexity threshold, each with its totals and worst entries in the
  # run summary. Like `secrets`, it runs every night whether or not there is a build, and it holds
  # nothing back — the follow-up issues come from its list, and the numbers can only go down.
  waste:
    name: duplication and complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run report:duplication
      - run: npm run report:complexity

  checks:
    name: checks
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      tag: ${{ needs.prepare.outputs.tag }}
      sync: true

  e2e:
    name: e2e
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    with:
      scope: full

  # The tests that passed only on retry (#494). The suite retries a failed test once, so a flake leaves
  # the run green and is said once, in a report nobody reads; this keeps one issue per flaky test —
  # opened the first night it shows, commented on every night after — so a flake is a thing on the
  # board rather than a re-run somebody pressed and forgot. It reads the full suite's shards, whatever
  # `e2e` concluded: a red night still says which of its other tests needed a second try. It holds
  # nothing back, and a failure here (GitHub not answering) is its own red, not the build's.
  flaky:
    name: flaky tests
    needs: [prepare, e2e]
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          sparse-checkout: scripts/flaky.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: blobs
          pattern: blob-report-full-*
          merge-multiple: true
      - name: Keep an issue per test that passed only on retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -d blobs ]; then echo "::warning::no shard left a report, so there is nothing to read"; exit 0; fi
          PLAYWRIGHT_JSON_OUTPUT_NAME=report.json npx --yes -p @playwright/test@1.65.0 playwright merge-reports --reporter=json ./blobs > /dev/null
          node scripts/flaky.mjs report.json > flaky.jsonl
          count=$(wc -l < flaky.jsonl | tr -d ' ')
          {
            echo "## Tests that passed only on retry: $count"
            jq -r '"- `\(.file):\(.line)` \(.name | split(" › ")[1:] | join(" › "))"' flaky.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$count" = 0 ] && { echo "no test needed a second try"; exit 0; }
          # The labels say where it goes: triage, so a person decides; never `status: ready` from here.
          while IFS= read -r line; do
            title=$(jq -r .title <<<"$line")
            body=$(jq -r --arg v "$VERSION" --arg run "$RUN_URL" '
              "`\(.file):\(.line)` failed, then passed on its retry, in the full browser suite of nightly `\($v)` ([run](\($run))).\n\n" +
              "```\n\(.error)\n```"' <<<"$line")
            # The open issue with exactly this title, if there is one: a search matches words, so the title is compared whole.
            number=$(gh issue list --state open --label "area: ci" --search "in:title \"$(jq -r .file <<<"$line")\"" --limit 100 \
              --json number,title | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Again, in nightly \`$VERSION\` ([run]($RUN_URL))."
              echo "flaky again: #$number $title"
            else
              gh issue create --title "$title" --label "status: triage" --label "type: bug" --label "area: ci" --body "$body

          Opened by the nightly's *flaky tests* job (#494). It comments here each night the test needs a second try again; close this when it is fixed."
              echo "flaky, new issue: $title"
            fi
          done < flaky.jsonl

  desktop:
    name: desktop
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      tag: ${{ needs.prepare.outputs.tag }}
      sign: true
      artifact: nightly
      retention-days: 14
      # Nightlies ship to people who run the app; their logs and feedback go to the api (#99).
      logs_url: https://api.anydag.com/v1/logs
      feedback_url: https://api.anydag.com/v1/feedback
    secrets: inherit

  # The two resource guards (#261, `docs/architecture/limits.md`): the server's idle CPU on a
  # 1k-file vault with the change feed open, and the time to `data-dag-ready` of a 200-node `arch`
  # diagram. Each ceiling in `scripts/bench-guard.json` is about twice what a runner measures, so it
  # goes red on a 2x regression and not on a slow runner. In the Playwright image, like the e2e
  # suite, for the same Chromium every night. It holds nothing back: `publish` does not wait for it,
  # because a slower build is a regression to look at, not a build that must not ship.
  bench:
    name: bench guard
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # Scripts are off, as in the e2e job: `prepare` installs git hooks, and the native modules arrive prebuilt.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vite build && node server/build.mjs
      - run: node scripts/bench.mjs --guard

  publish:
    name: publish
    needs: [prepare, checks, e2e, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # Keep this under ten. electron-updater reads GitHub's releases feed, which lists the ten
      # newest releases, and a beta build finds its next version there: ten nightlies in a row
      # would push the last beta and the last stable out of it. Only the releases are deleted — the
      # branches and the tags stay.
      NIGHTLY_KEEP: "7"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: nightly-*
          merge-multiple: true
      - name: Every installer and every updater file is there
        run: |
          ls -la out
          node scripts/check-release-assets.mjs out "$VERSION"
      - name: Create the pre-release
        run: |
          # Notes: what was merged since the previous nightly.
          prev=$(git tag --list 'v*-nightly.*' | while read -r t; do echo "${t##*-nightly.} $t"; done | sort -n | awk -v self="$TAG" '$2 != self {t=$2} END {print t}')
          notes=()
          [ -n "$prev" ] && notes=(--notes-start-tag "$prev")
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "AnyDag nightly ${VERSION##*-nightly.}" \
            --generate-notes "${notes[@]}" \
            --verify-tag \
            --prerelease \
            --latest=false
      - name: Prune old nightlies
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -- '-nightly\.' \
            | while read -r t; do echo "${t##*-nightly.} $t"; done \
            | sort -rn | tail -n +"$((NIGHTLY_KEEP + 1))" | cut -d' ' -f2 \
            | while read -r t; do
                echo "Deleting the release of $t (its tag and branch stay)"
                gh release delete "$t" --repo "${{ github.repository }}" --yes
              done
