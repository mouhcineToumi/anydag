# The desktop app, built and opened on a pull request that touches what it is made of — on Linux,
# Windows and macOS.
#
# Each leg builds the page, the server, the CLI and the shell, packages them
# (`desktop/package.mjs`: an AppImage; an NSIS installer; a dmg and a zip for arm64 and for x64),
# then opens the packaged app on a temp vault (`desktop/smoke.mjs`) and passes only when the page
# reports `data-dag-ready`. macOS opens both of its builds: the arm64 one natively and the x64 one
# under Rosetta. What was built is kept as the run's artifact for a week.
#
# **No certificate reaches this workflow**, so nothing it builds is signed with one: the macOS app
# is signed ad hoc and the Windows installer is not signed — exactly what a release without signing
# secrets ships. A pull request's code never runs next to a signing key. A tagged release is
# `release.yml`, which runs the same steps, signs when it can, and publishes.
name: desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "cli/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git's bash on Windows, so one spelling of every step serves the three.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Package
        run: node desktop/package.mjs
      - name: Open it (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node desktop/smoke.mjs
      - name: Open it
        if: runner.os != 'Linux'
        run: node desktop/smoke.mjs
      - name: Open the x64 build too (macOS, under Rosetta)
        if: runner.os == 'macOS'
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            node desktop/smoke.mjs --app release/mac/AnyDag.app/Contents/MacOS/AnyDag
          else
            echo "::warning::no Rosetta on this runner — the x64 build was packaged but not opened"
          fi
      - name: What was built
        run: ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: anydag-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
