# The fast tier, and — for a release or a nightly — the api server's own tests.
#
# One definition for `ci.yml`, `nightly.yml` and `release.yml`. The fast tier is `npm run checks`
# (`scripts/checks.sh`: typecheck, lint, the `check:*` contracts, parity and the unit suite): no
# browser, no network.
#
# **Its halves run side by side** (#258): `fast tier` is `checks.sh static` (seven seconds behind the
# install), `unit` is `checks.sh unit`, and the watched store contracts are a job of their own. In
# one job they were two minutes on the path to `CI passed`, one after another; apart, the longest is
# the unit suite, and each extra job costs only its twenty-second install.
#
# **`tsc` is incremental** and keeps its build info under `node_modules/.cache/tsc/`, which `npm ci`
# deletes. It is restored after the install, keyed on what decides whether it is valid (the
# lockfile and the tsconfigs) and then on the commit: a run starts from the newest one a branch or
# `develop` saved, so it checks what changed. Pull requests read the caches `develop` saves.
name: checks

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit or tag to check. Empty is the caller's own."
        type: string
        default: ""
      tag:
        description: "When set, the version in the tree must be this tag."
        type: string
        default: ""
      sync:
        description: "Also run the api server's convergence harness and its Postgres suites."
        type: boolean
        default: false

permissions:
  contents: read

# Electron and electron-builder's tools come from npmmirror, not GitHub's release downloads,
# which once returned 504 for a whole morning (#46). Nothing is trusted for the mirror's own checksum:
# see "Electron and electron-builder's tools come from npmmirror" in docs/architecture/desktop.md.
env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  fast:
    name: fast tier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `tsc -p desktop` needs Electron's types, not its 100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # What `check:duplication` and `check:complexity` compare a change with: the commit the pull
      # request is based on. The step below fetches it; on a push, a nightly or a release it is
      # empty and the checks have no change to measure, which they say rather than guess.
      ANYDAG_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # A checkout is one commit deep, so the base commit is not there, and both waste checks need
      # it (`scripts/lib/change.mjs`). The event's own base sha, not the branch's tip: the tip may
      # have moved since the merge ref was made, and a change is measured against the commit it was
      # written on.
      - name: The base, for the waste checks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag is the version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/check-version.mjs "$TAG"
      - run: npm ci
      - name: tsc's incremental build info
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      # One step rather than a list, and `scripts/checks.sh` is why: the same list was written out in
      # CI, in `scripts/gate.sh` and in `.githooks/pre-commit`. The script prints each step's name,
      # so a red run still says which one went red. The unit suite is the `unit` job's.
      - run: npm run checks -- static

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run checks -- unit

  # The store's contracts once more with every test vault watched from the start, as `anydag serve`
  # watches each vault it opens: what holds the kept listing (#280) to what a walk says. About 18 s,
  # so not in the commit hook.
  watched:
    name: store over a kept listing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The store's contracts over a kept listing
        env:
          ANYDAG_TEST_WATCH: "1"
          ANYDAG_CLOUD: "on"
        run: npx vitest run test/server

  # typescript-eslint's three promise rules (`eslint.config.mjs`) over one program that includes
  # `e2e/` and `desktop/`, which no `tsc` step checks. About 40 s, so it is a job of its own beside the
  # fast tier rather than a step in it, and not in the commit hook.
  promises:
    name: promises
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:promises

  # The api server is a separate process with its own wire and its own suites, and these are the
  # slow ones: a hundred seeded schedules of two or three devices editing, renaming and going offline
  # (`api/test/converge.test.ts`), and the metadata, route and collector suites on a real Postgres.
  sync:
    name: api server
    if: inputs.sync
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # `npm run api:test:pg` reads this; the default is `api/compose.yaml`'s port on a laptop.
      ANYDAG_API_TEST_PG: postgres://anydag:anydag@127.0.0.1:5432/anydag_api
    services:
      postgres:
        # The image `api/compose.yaml` runs, with the same credentials.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anydag
          POSTGRES_PASSWORD: anydag
          POSTGRES_DB: anydag_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anydag -d anydag_api"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Convergence (a hundred seeds)
        run: npm run api:converge
      - name: Meta, routes and the collector on Postgres
        run: npm run api:test:pg
