# What runs on a pull request and on a push to a long-lived branch — the test tiers.
#
#   every run                      the secret scan of the commits it adds (`secrets`, below)
#   pull request into develop      fast tier (typecheck, lint, contracts, unit) + the desktop app on
#                                  Linux, when something it is made of changed
#   push to develop                fast tier
#   release/**, hotfix/**          fast tier + the desktop app on Linux, Windows and macOS — on a push,
#   and a pull request into main   on a pull request into them, and on any pull request into main
#   nightly and release            everything: `nightly.yml` and `release.yml`, which call the same
#                                  reusable workflows (`checks.yml`, `desktop-build.yml`, `e2e.yml`)
#
# **The fast tier always runs, whatever changed**, so a required check always reports. Only the
# heavy job is skipped for a change that cannot touch the app (docs, issue templates, e2e specs…).
#
# **`CI passed` is the one check to require.** A reusable workflow's jobs exist only when the job that
# calls it runs, so "desktop / build (ubuntu-latest)" is never reported on a pull request that skipped
# it, and a ruleset waiting for it would wait for ever. `CI passed` runs last, always, and is red when
# a job that should have run did not pass.
#
# Playwright's own tiers are `e2e.yml`. Policy about a pull request itself (its title, its target and
# the issue it closes) is `pr-policy.yml`, in a workflow of its own because it re-runs on an edit or a
# label, and re-running this one for that would cancel a desktop build already in flight.
name: ci

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request makes the older run's answer worthless; on a branch every commit's
  # own result is the record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What changed, and so which heavy jobs this run owes.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop_os: ${{ steps.plan.outputs.desktop_os }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Everything the packaged app is built from. Docs, issue templates, e2e specs, boards
            # and unit tests are not in it (`desktop/electron-builder.yml` excludes them from the
            # package too), and the unit suite, which always runs, is what reads them.
            desktop:
              - "desktop/**"
              - "server/**"
              - "cli/**"
              - "src/**"
              - "sync/**"
              - "plugins/**"
              - "icons/**"
              - "themes/**"
              - "public/**"
              - "index.html"
              - "vite.config.ts"
              - "tsconfig*.json"
              - "package.json"
              - "package-lock.json"
              - "VERSION"
              - ".github/workflows/desktop-build.yml"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"
              - ".github/actions/**"
      - name: Which desktop builds are owed
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref_name }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
        run: |
          all='["ubuntu-latest","windows-latest","macos-latest"]'
          linux='["ubuntu-latest"]'
          os=""
          if [ "$EVENT" = "pull_request" ]; then
            case "$BASE" in
              main | release/* | hotfix/*) os="$all" ;;   # a release is verified everywhere
              *) os="$linux" ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            os="$all"; DESKTOP=true
          else
            case "$REF" in
              release/* | hotfix/*) os="$all" ;;
            esac
          fi
          if [ "$DESKTOP" != "true" ]; then os=""; fi
          echo "desktop_os=$os" >> "$GITHUB_OUTPUT"
          echo "desktop builds: ${os:-none}"

  # Secrets, in the commits this run adds: a pull request's (base..head), or a push's (before..after;
  # the whole history for a new branch or a manual run, which have no "before"). The repository is
  # public, so this is the last stop before a secret is published — and it is the hard stop, since
  # the pre-commit hook only warns on a machine without gitleaks. The whole history is nightly's.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks
      - name: The config still catches a planted token
        run: bash scripts/secrets.sh selftest
      - name: No secret in the commits this run adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            bash scripts/secrets.sh range "$PR_BASE" "$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bash scripts/secrets.sh range "$BEFORE" "$AFTER"
          else
            bash scripts/secrets.sh all
          fi

  checks:
    name: checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  desktop:
    name: desktop
    needs: changes
    if: needs.changes.outputs.desktop_os != ''
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
    with:
      os: ${{ needs.changes.outputs.desktop_os }}
      artifact: desktop
      # No certificate reaches a run on a pull request; a branch's build is a check, not a release.
      sign: false

  # The workflow files themselves. Cheap, and the one place a typo in a `needs` or an expression is
  # found before it is a red nightly at two in the morning.
  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  required:
    name: CI passed
    needs: [changes, secrets, checks, desktop, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Everything this run owed passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SECRETS: ${{ needs.secrets.result }}
          CHECKS: ${{ needs.checks.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_OS: ${{ needs.changes.outputs.desktop_os }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
        run: |
          bad=0
          want() { # name, result, owed ("true"/"false")
            if [ "$2" = "success" ] || { [ "$3" = "false" ] && [ "$2" = "skipped" ]; }; then
              echo "ok   $1: $2"
            else
              echo "::error::$1 is $2"; bad=1
            fi
          }
          want changes "$CHANGES" true
          want secrets "$SECRETS" true
          want checks "$CHECKS" true
          want desktop "$DESKTOP" "$([ -n "$DESKTOP_OS" ] && echo true || echo false)"
          want actionlint "$ACTIONLINT" "$([ "$WORKFLOWS" = true ] && echo true || echo false)"
          exit $bad
