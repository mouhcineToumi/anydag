# A release: push a tag `vX.Y.Z` (stable) or `vX.Y.Z-beta.N` (beta) and this builds, checks and
# publishes it. Nightlies are `nightly.yml`'s, and this never runs for one.
#
#   0. **The tag is allowed.** A stable tag must be on `main` — which only a pull request from
#      `release/X.Y.Z` or `hotfix/X.Y.Z` changes — and a beta tag on `release/X.Y.Z` (or a
#      `hotfix/X.Y.Z`) of the same version. Any other pre-release word is refused.
#   1. The tag must equal `VERSION` and `package.json` (`scripts/check-version.mjs`), so a release
#      can never be built from a tree that says another number.
#   2. Everything runs, once: the fast tier and the sync server's suites (`checks.yml`), the full
#      Playwright run (`e2e.yml`), and the desktop app packaged and opened on each system
#      (`desktop-build.yml`) — an AppImage for x64 Linux, an NSIS installer for x64 Windows, a dmg and
#      a zip each for arm64 and x64 macOS.
#   3. A GitHub Release is created for the tag with every installer, their blockmaps, and the three
#      files the app's updater reads — `latest-linux.yml`, `latest.yml` and `latest-mac.yml` for a stable
#      release, `beta*.yml` for a beta (`scripts/check-release-assets.mjs` holds the list). It is not
#      made unless all of them are there. A beta is a pre-release; a stable release is the "latest"
#      one, the only kind a stable build is ever offered. The notes are generated from the merged pull
#      requests by their labels (`.github/release.yml`); edit them on GitHub afterwards.
#
# **Signing switches on with the secrets, and is skipped cleanly without them.**
#   - macOS: `CSC_LINK` (a Developer ID Application .p12, base64) and `CSC_KEY_PASSWORD` sign;
#     `APPLE_ID`, `APPLE_APP_SPECIFIC_PASSWORD` and `APPLE_TEAM_ID` notarise. Without a certificate
#     the app is signed ad hoc: it installs, Gatekeeper asks once, and it does not update itself.
#   - Windows: `WIN_CSC_LINK` (a code-signing .pfx, base64) and `WIN_CSC_KEY_PASSWORD`. Without
#     them the installer is unsigned and SmartScreen asks once.
#   `desktop/package.mjs` reads them; an absent secret arrives as an empty string and counts as none.
name: release

on:
  push:
    tags: ["v*", "!v*-nightly.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The tag is the version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$TAG"
      - name: The tag is a release, and it is where a release is
        id: kind
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          core=${version%%-*}
          case "$version" in
            *-*)
              case "$version" in
                *-beta.*) kind=beta ;;
                *) echo "::error::$TAG: only stable (vX.Y.Z) and beta (vX.Y.Z-beta.N) tags are releases. Nightlies are tagged by nightly.yml alone."; exit 1 ;;
              esac
              on=$(git branch -r --contains "$SHA" | sed 's/^[ *]*//' | grep -E "^origin/(release|hotfix)/$core$" || true)
              if [ -z "$on" ]; then
                echo "::error::$TAG must be a commit of release/$core (or hotfix/$core); no such branch contains $SHA."
                exit 1
              fi
              echo "$TAG is on ${on#origin/}." ;;
            *)
              kind=stable
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor "$SHA" origin/main; then
                echo "::error::$TAG is not on main. A stable release is tagged on the merge commit of the pull request from release/$core or hotfix/$core into main — see docs/RELEASING.md."
                exit 1
              fi
              echo "$TAG is on main." ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  checks:
    name: checks
    needs: verify
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      sync: true

  e2e:
    name: e2e
    needs: verify
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    with:
      scope: full

  desktop:
    name: desktop
    needs: verify
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      sign: true
      artifact: release
    secrets: inherit

  publish:
    name: publish
    needs: [verify, checks, e2e, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      KIND: ${{ needs.verify.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: release-*
          merge-multiple: true
      - name: Every installer and every updater file is there
        run: |
          ls -la out
          node scripts/check-release-assets.mjs out "$TAG"
      - name: Create the release
        run: |
          version=${TAG#v}
          # The notes cover what changed since the release before this one: the last stable tag for a
          # stable release; for a beta, the last beta of this version, else the last stable.
          tags=$(git tag --list 'v*' --sort=-v:refname | grep -vF -- "-nightly." | grep -vx "$TAG" || true)
          if [ "$KIND" = beta ]; then
            prev=$(echo "$tags" | grep -E "^v${version%%-*}-beta\." | head -n 1 || true)
            [ -n "$prev" ] || prev=$(echo "$tags" | grep -v -- '-' | head -n 1 || true)
            flags=(--prerelease)
          else
            prev=$(echo "$tags" | grep -v -- '-' | head -n 1 || true)
            flags=(--latest)
          fi
          notes=()
          [ -n "$prev" ] && notes=(--notes-start-tag "$prev")
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "AnyDag $version" \
            --generate-notes "${notes[@]}" \
            --verify-tag \
            "${flags[@]}"
