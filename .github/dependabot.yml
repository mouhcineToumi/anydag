# Dependency updates, weekly, into `develop` — the branch every change goes through.
#
# The npm updates are grouped, minor and patch together, so a week is one pull request rather than
# thirty; a major version is its own. Titles are Conventional Commits (`pr-policy.yml` requires it)
# and the pull requests are exempt from the linked-issue rule as a bot's.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Tiptap follows BlockNote, so Dependabot must not move it on its own. `@blocknote/*` was built
    # against one exact tiptap build — every `@tiptap/*` package peer-depends on the same `@tiptap/core`
    # and `@tiptap/pm` to the patch — and our three direct pins (`@tiptap/core`, `@tiptap/extension-code`,
    # `@tiptap/pm`) only import it. A bump of them alone leaves BlockNote's own tiptap packages on the
    # old build, so npm installs a second copy of the editor's types: the `Mark` that
    # `createStyleSpecFromTipTapMark` takes is no longer the `Mark` BlockNote hands it, and
    # `src/blocks/math.tsx`, `src/blocks/syntax.ts` and `src/note/schema.ts` stop typechecking. Bump the
    # pins by hand with BlockNote, in the same commit, and let npm dedupe the family. A major is not
    # ignored: it arrives as its own pull request, where a BlockNote major is the thing to decide first.
    ignore:
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
