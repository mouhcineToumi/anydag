# The labels this repository uses. One entry per label: name, color (hex, no #), description.
#
# Nothing applies this file by itself. To sync it, use a label-sync tool or
# `gh label create "<name>" --color <color> --description "<description>" --force` for each entry.
# Labels already on the repository that are not listed here are left alone.

# --- Where an issue is in the workflow ---------------------------------------------------------
# Every new issue gets `status: triage` from its form. A pull request into `develop` must close
# an issue that is `status: ready`.
- name: "status: triage"
  color: "fbca04"
  description: "New; the maintainer has not decided yet"
- name: "status: needs-info"
  color: "d4c5f9"
  description: "Missing something from the Definition of Ready; see the comments"
- name: "status: ready"
  color: "0e8a16"
  description: "Accepted and well defined; anyone may pick it up"
- name: "status: in-progress"
  color: "1d76db"
  description: "Someone is working on it"
- name: "status: blocked"
  color: "b60205"
  description: "Cannot move until something else happens"

# --- What kind of change ------------------------------------------------------------------------
- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as it should"
- name: "type: feature"
  color: "a2eeef"
  description: "New behaviour or an improvement"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: chore"
  color: "cfd3d7"
  description: "Maintenance, refactoring, tooling, dependencies"

# --- Which part of the app ----------------------------------------------------------------------
- name: "area: canvas"
  color: "5319e7"
  description: "The infinite canvas, editing, layout and rendering of boards"
- name: "area: dsl"
  color: "5319e7"
  description: "The diagram grammar, parsers, diagnostics and the library"
- name: "area: notes"
  color: "5319e7"
  description: "Notes, the block editor, equations, references and search"
- name: "area: tables"
  color: "5319e7"
  description: "Tables and CSV"
- name: "area: quizzes"
  color: "5319e7"
  description: "Quizzes, practice and Mistakes"
- name: "area: tasks-calendar"
  color: "5319e7"
  description: "Tasks, projects, events and the calendar"
- name: "area: sync"
  color: "5319e7"
  description: "The sync server and the app's sync client"
- name: "area: desktop"
  color: "5319e7"
  description: "The Electron app, packaging, updates and installers"
- name: "area: cli-mcp"
  color: "5319e7"
  description: "The anydag command line and the MCP server"
- name: "area: assistant"
  color: "5319e7"
