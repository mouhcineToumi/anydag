# anydag-sync on this machine: Postgres and the server, both on
# 127.0.0.1 only. `docker compose -f sync/compose.yaml up -d db` is Postgres alone, which is what
# `npm run sync:dev` and `npm run sync:test:pg` want; `up` with no service adds the server's image,
# built from `sync/dist/` — so `npm run sync:build` first, which is what `npm run sync:up` does.
name: anydag-sync
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anydag
      POSTGRES_PASSWORD: anydag
      POSTGRES_DB: anydag_sync
    ports:
      - "127.0.0.1:${ANYDAG_SYNC_PG_PORT:-55432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anydag -d anydag_sync"]
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    build:
      context: ./dist
      dockerfile: ../Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://anydag:anydag@db:5432/anydag_sync
      ANYDAG_SYNC_DATA: /data
      ANYDAG_SYNC_PORT: "8790"
      ANYDAG_SYNC_MODE: ${ANYDAG_SYNC_MODE:-single}
      ANYDAG_SYNC_ADMIN_TOKEN: ${ANYDAG_SYNC_ADMIN_TOKEN:-}
      ANYDAG_SYNC_PUBLIC_URL: http://127.0.0.1:${ANYDAG_SYNC_PORT:-8790}
      # The feedback relay (docs/architecture/feedback.md): unset, /v1/feedback answers 503.
      ANYDAG_FEEDBACK_GITHUB_TOKEN: ${ANYDAG_FEEDBACK_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:${ANYDAG_SYNC_PORT:-8790}:8790"
    volumes:
      - blobs:/data
volumes:
  db:
  blobs:
